name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.34.0)'
        required: false
        default: 'v2.34.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools env/bootstrap modules/core/pristine

          # 1. Hydrate Bionic bootstrap if absent
          if [ ! -f "env/bootstrap/bootstrap.tar.gz" ] && [ ! -f "env/bootstrap/bootstrap-aarch64.zip" ]; then
            echo "[CI] Hydrating bootstrap.tar.gz from v2.33.0 release..."
            if gh release download v2.33.0 -p antigravity.apk -D /tmp --clobber; then
              python3 -c "import zipfile, shutil; z=zipfile.ZipFile('/tmp/antigravity.apk'); shutil.copyfileobj(z.open('assets/env/bootstrap/bootstrap.tar.gz'), open('env/bootstrap/bootstrap.tar.gz','wb'))"
              rm -f /tmp/antigravity.apk
            else
              echo "[CI] Fallback: downloading Termux bootstrap-aarch64.zip..."
              gh release download -R termux/termux-packages -p bootstrap-aarch64.zip -D env/bootstrap --clobber || \
              curl -fsSL -o env/bootstrap/bootstrap-aarch64.zip "https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip"
            fi
          fi

          # 2. Hydrate pristine Antigravity v2.34.0 Linux ARM64 language_server if absent
          if [ ! -f "modules/core/pristine/language_server.tar.gz" ]; then
            echo "[CI] Downloading Antigravity v2.34.0 Linux ARM64 language_server..."
            curl -fsSL -o /tmp/language_server "https://storage.googleapis.com/antigravity-public/antigravity-hub/2.34.0-5887025308631040/unsigned/language_server-linux-arm64"
            echo "384fd3a5a467a136c44cd32d148ec75cd165ca6fbcb8aa57166cf7c7e59421d2  /tmp/language_server" | sha256sum -c -
            chmod 0755 /tmp/language_server
            tar -C /tmp -czf modules/core/pristine/language_server.tar.gz language_server
            rm -f /tmp/language_server
          fi

          # 3. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Setup Android API 34 android.jar if absent (required for values-v31 splash attributes)
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 34)..."
            if curl -fsSL -o /tmp/platform-34.zip "https://dl.google.com/android/repository/platform-34-ext7_r03.zip"; then
              python3 -c "import zipfile, shutil; z=zipfile.ZipFile('/tmp/platform-34.zip'); n=[x for x in z.namelist() if x.endswith('/android.jar')][0]; shutil.copyfileobj(z.open(n), open('tools/android.jar','wb'))"
              rm -f /tmp/platform-34.zip
            else
              curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-34/android.jar"
            fi
          fi

          # 5. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 6. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Release APK (dist/antigravity.apk)
        run: |
          bash build.sh

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-binaries
          path: |
            dist/antigravity.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/SHA256SUMS.txt
          body: |
            ## Antigravity for Android

            Native Android ARM64 port of Antigravity running directly on Bionic userspace — no PRoot or chroot.

            ### Downloads

            | Artifact | Package ID | Description |
            | :--- | :--- | :--- |
            | **`antigravity.apk`** | `com.agy` | Production release (`port 45157`, Android 7.0+ ARM64) |
            | **`SHA256SUMS.txt`** | — | SHA-256 checksum for package verification |

            ### What's New in v2.34.0

            - **Upstream v2.34.0 Core & Web Sync:** Updated native ARM64 `language_server` (`go1.28-20261102-RC01`), web workbench assets, binary patchers (`crash_suppressor`, `nosandbox`), and `web/patch_main.py`.
            - **Skills & Plugins Catalogue:** Browse and one-tap install `10` plugins (`rtk`, `antislop`, `superpowers`, `impeccable`, `context-mode`, `agents-suite`, `planning-with-files`, `sepia`, `gemini-agent-skills`, `antigravity-skills-manager`) and `23` skills under **Settings ➔ Skills & Plugins**, **Settings ➔ Appearance**, or `/customizations`.
            - **Persistent Notification with Stop Control:** Status bar notification stays pinned while active and includes a **Stop** button for clean shutdown of the app, core server, HTTP gateway, wake locks, and `agy-daemon`.

            ### Core Capabilities

            - **Multi-Provider AI Gateway (BYOK):** Google Gemini, OpenAI, Anthropic Claude (incl. custom Anthropic endpoints), OpenRouter, Groq, DeepSeek, or any OpenAI-compatible endpoint.
            - **Voice Mode & AudioWorklet:** Real-time `SpeechRecognizer`, 16 kHz PCM cloud transcription (Whisper / Gemini), and native TTS.
            - **Built-in Web Terminal & Shizuku:** PTY bash shell, `pkg` package manager, `agy-daemon` scheduler, and elevated ADB shell (`rish`).
            - **ARMv8.0-A Compatibility:** Transparent atomic & SIMD emulation (`liblse_compat.so`) for devices without hardware LSE.

            > [!NOTE]
            > **Seamless Upgrades:** Signed with the repository keystore so you can install directly over previous `v2.x` releases without losing local data. See [RELEASE_NOTES.md](https://github.com/Comzvy/antigravity-arm64-android/blob/main/RELEASE_NOTES.md) for the full changelog.
