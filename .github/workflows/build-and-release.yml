name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.33.0)'
        required: false
        default: 'v2.33.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools env/bootstrap modules/core/pristine

          # 1. Hydrate Bionic bootstrap if absent
          if [ ! -f "env/bootstrap/bootstrap.tar.gz" ] && [ ! -f "env/bootstrap/bootstrap-aarch64.zip" ]; then
            echo "[CI] Hydrating bootstrap.tar.gz from v2.33.0 release..."
            if gh release download v2.33.0 -p antigravity.apk -D /tmp --clobber; then
              python3 -c "import zipfile, shutil; z=zipfile.ZipFile('/tmp/antigravity.apk'); shutil.copyfileobj(z.open('assets/env/bootstrap/bootstrap.tar.gz'), open('env/bootstrap/bootstrap.tar.gz','wb'))"
              rm -f /tmp/antigravity.apk
            else
              echo "[CI] Fallback: downloading Termux bootstrap-aarch64.zip..."
              gh release download -R termux/termux-packages -p bootstrap-aarch64.zip -D env/bootstrap --clobber || \
              curl -fsSL -o env/bootstrap/bootstrap-aarch64.zip "https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip"
            fi
          fi

          # 2. Hydrate pristine Antigravity v2.33.0 Linux ARM64 language_server if absent
          if [ ! -f "modules/core/pristine/language_server.tar.gz" ]; then
            echo "[CI] Downloading Antigravity v2.33.0 Linux ARM64 language_server..."
            curl -fsSL -o /tmp/language_server "https://storage.googleapis.com/antigravity-public/antigravity-hub/2.33.0-4731201358004224/unsigned/language_server-linux-arm64"
            echo "9772a2fd0d7654b317d439afec450a051018d0c69c9fb96e642a801846170fec  /tmp/language_server" | sha256sum -c -
            chmod 0755 /tmp/language_server
            tar -C /tmp -czf modules/core/pristine/language_server.tar.gz language_server
            rm -f /tmp/language_server
          fi

          # 3. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 4. Setup Android API 34 android.jar if absent (required for values-v31 splash attributes)
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 34)..."
            if curl -fsSL -o /tmp/platform-34.zip "https://dl.google.com/android/repository/platform-34-ext7_r03.zip"; then
              python3 -c "import zipfile, shutil; z=zipfile.ZipFile('/tmp/platform-34.zip'); n=[x for x in z.namelist() if x.endswith('/android.jar')][0]; shutil.copyfileobj(z.open(n), open('tools/android.jar','wb'))"
              rm -f /tmp/platform-34.zip
            else
              curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-34/android.jar"
            fi
          fi

          # 5. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 6. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Release APK (dist/antigravity.apk)
        run: |
          bash build.sh

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-binaries
          path: |
            dist/antigravity.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/SHA256SUMS.txt
          body: |
            ## Antigravity for Android

            Autonomous AI coding workstation running natively on Android ARM64 Bionic userspace.

            ### Downloads

            | Artifact | Package ID | Description |
            | :--- | :--- | :--- |
            | **`antigravity.apk`** | `com.agy` | Standard production release (`port 45157`) |
            | **`SHA256SUMS.txt`** | — | SHA-256 checksum for package verification |

            ### Highlights

            - **Core v2.33.0 (Linux ARM64 Port):** Runs `language_server` natively in Android Bionic userspace with `wsTransport=3` WebSocket multiplexing and automatic agent stream resync.
            - **Multi-Provider AI Gateway (BYOK):** Configure **Google Gemini**, **OpenAI**, **Anthropic Claude** (including custom Anthropic endpoints), **OpenRouter**, **Groq**, **DeepSeek**, or custom OpenAI-compatible servers.
            - **Voice Mode & AudioWorklet:** Real-time `SpeechRecognizer`, `RecognizerIntent` fallback, 16 kHz PCM WebAudio capture with AudioWorklet CSP support, cloud Whisper/Gemini transcription, and native TTS.
            - **Built-in Web Terminal & PTY Support:** Native shell execution (`$PREFIX/bin/bash` -> `runtime/bin/bash` -> `/system/bin/sh`) with `xterm-256color` terminfo.
            - **ARMv8.0-A Compatibility (`liblse_compat.so`):** Transparent atomic & SIMD emulation for FEAT_LSE, FEAT_RDM, and FEAT_FCMA on older ARMv8.0-A SoCs.
            - **Android Native Integrations:** Dynamic Dark/Light theme sync, Keep Screen Awake, background/lockscreen persistence (`PARTIAL_WAKE_LOCK` + `WIFI_MODE_FULL_LOW_LATENCY`), universal media/file picker, Shizuku (`rish`) elevated shell, `agy-daemon`, and `pkg` package manager.

            > [!NOTE]
            > **Seamless Upgrades:** Signed with the repository keystore so you can install directly over previous `v2.x` releases without losing local data.
