<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="title description">
  <title id="title">Antigravity for Android (ARM64)</title>
  <desc id="description">Native ARM64 AI software engineering workstation running directly on Android Bionic userspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#111026"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#080d19"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="22" fill="url(#grid)"/>
  <ellipse cx="990" cy="190" rx="400" ry="300" fill="url(#glow)"/>
  <rect x="44" y="0" width="1192" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <rect x="72" y="62" width="308" height="32" rx="16" fill="#131e33" stroke="#28354d"/>
    <circle cx="92" cy="78" r="4.5" fill="#34d399"/>
    <text x="107" y="83" fill="#cbd5e1" font-size="12.5" font-weight="650" letter-spacing="0.9">COMZVY  ·  ANDROID ARM64  ·  v2.33.0</text>

    <text x="70" y="158" fill="#f8fafc" font-size="56" font-weight="780" letter-spacing="-2.2">Antigravity</text>
    <text x="72" y="213" fill="url(#accent)" font-size="44" font-weight="740" letter-spacing="-1.4">for Android</text>
    <text x="72" y="255" fill="#9fb0c9" font-size="17.5">Native AI coding workstation on Android Bionic — zero containers.</text>

    <g font-size="12.5" font-weight="600">
      <rect x="72" y="290" width="136" height="34" rx="17" fill="#131e33" stroke="#28354d"/>
      <text x="90" y="312" fill="#e0f2fe">✦  Multi-model AI</text>
      <rect x="218" y="290" width="116" height="34" rx="17" fill="#131e33" stroke="#28354d"/>
      <text x="236" y="312" fill="#e0f2fe">◉  Voice Mode</text>
      <rect x="344" y="290" width="122" height="34" rx="17" fill="#131e33" stroke="#28354d"/>
      <text x="362" y="312" fill="#e0f2fe">&gt;_  PTY Shell</text>
      <rect x="476" y="290" width="122" height="34" rx="17" fill="#131e33" stroke="#28354d"/>
      <text x="494" y="312" fill="#e0f2fe">⌘  ARMv8.0+</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="738" y="58" width="472" height="264" rx="16" fill="url(#cardBg)" stroke="#28354d" stroke-width="1.5"/>
    <path d="M739 104H1209" stroke="#1e293b"/>
    <circle cx="766" cy="81" r="5" fill="#fb7185"/>
    <circle cx="786" cy="81" r="5" fill="#fbbf24"/>
    <circle cx="806" cy="81" r="5" fill="#34d399"/>
    <text x="836" y="86" fill="#64748b" font-size="12">~/workspace  ·  aarch64-bionic</text>

    <text x="770" y="140" fill="#7dd3fc" font-size="13.5">$ agy status --native</text>

    <circle cx="776" cy="171" r="4" fill="#34d399"/>
    <text x="792" y="176" fill="#cbd5e1" font-size="13">Core v2.33.0 (Bionic)</text>
    <text x="1126" y="176" fill="#34d399" font-size="12">ACTIVE</text>

    <circle cx="776" cy="202" r="4" fill="#34d399"/>
    <text x="792" y="207" fill="#cbd5e1" font-size="13">wsTransport=3 + Auto-Resync</text>
    <text x="1126" y="207" fill="#34d399" font-size="12">ONLINE</text>

    <circle cx="776" cy="233" r="4" fill="#34d399"/>
    <text x="792" y="238" fill="#cbd5e1" font-size="13">BYOK Multi-Provider Gateway</text>
    <text x="1134" y="238" fill="#34d399" font-size="12">READY</text>

    <circle cx="776" cy="264" r="4" fill="#34d399"/>
    <text x="792" y="269" fill="#cbd5e1" font-size="13">Voice AudioWorklet + Shizuku</text>
    <text x="1134" y="269" fill="#34d399" font-size="12">READY</text>

    <rect x="770" y="286" width="408" height="1" fill="#1e293b"/>
    <text x="770" y="307" fill="#818cf8" font-size="12">Gradle-free APK · Built for mobile workflows</text>
  </g>
</svg>
