<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 355" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="355" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="355" rx="20" fill="url(#grid)" />
  <rect width="1200" height="355" rx="20" fill="url(#glow1)" />
  <rect width="1200" height="355" rx="20" fill="url(#glow2)" />

  <!-- Top Accent Line -->
  <rect x="350" y="0" width="500" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Left Abstract Terminal / Core Illustration -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="242" height="250" rx="16" fill="#0B1120" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="20" r="5" fill="#EF4444" />
    <circle cx="38" cy="20" r="5" fill="#F59E0B" />
    <circle cx="54" cy="20" r="5" fill="#10B981" />
    <text x="75" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">bionic://arm64-v8a</text>
    <line x1="0" y1="36" x2="242" y2="36" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="62" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold">$ agy status</text>
    <text x="18" y="84" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">✓ Core Engine: Active</text>
    <text x="18" y="104" fill="#A855F7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">✓ AI Router: Multi-Model BYOK</text>
    <text x="18" y="124" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">✓ Voice STT/TTS &amp; HUD: Ready</text>
    <text x="18" y="144" fill="#EC4899" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">✓ Touch UX &amp; Haptics: Enabled</text>
    <text x="18" y="164" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">✓ WakeLock &amp; Theme Sync: ON</text>

    <rect x="14" y="186" width="214" height="46" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.45" />
    <text x="26" y="214" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="bold">⚡ Bare-Metal Android IDE</text>
  </g>

  <!-- Main Heading & Subtitle -->
  <g transform="translate(335, 66)">
    <!-- Edition Badge -->
    <rect x="0" y="0" width="250" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="14" r="4" fill="#38BDF8" />
    <text x="28" y="18" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">COMZVY ENHANCED EDITION</text>

    <!-- Title -->
    <text x="0" y="72" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Antigravity Android</text>

    <!-- Subtitle -->
    <text x="0" y="106" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">
      Autonomous Agentic AI Coding Environment Optimized for Android Touch &amp; ARM64
    </text>

    <!-- Feature Pills Row 1 -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="186" height="36" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="23" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🔑 Multi-Provider BYOK</text>

      <rect x="198" y="0" width="194" height="36" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <text x="213" y="23" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🎙️ Live Voice HUD &amp; TTS</text>

      <rect x="404" y="0" width="210" height="36" rx="10" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.55" />
      <text x="419" y="23" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">📳 Native Haptics &amp; Back</text>
    </g>

    <!-- Feature Pills Row 2 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="186" height="36" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <text x="15" y="23" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">📱 Bottom-Sheet Modals</text>

      <rect x="198" y="0" width="194" height="36" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <text x="213" y="23" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🌙 Adaptive Theme Sync</text>

      <rect x="404" y="0" width="210" height="36" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" />
      <text x="419" y="23" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">🔒 Lockscreen Persistence</text>
    </g>
